name: Daily price check

on:
  schedule:
    - cron: '0 9 * * *'   # runs daily at 9am UTC - edit to your preferred time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit prices.db back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python3 track_prices.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated prices.db
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add prices.db
          git diff --staged --quiet || git commit -m "Update tracked prices [skip ci]"
          git push
